    - "getkin/kin-openapi v0.145.0"

approach:
  chosen: "Declarative CEL templates with OpenAPI v3 typed parameters, each abstraction offered in a namespaced and a cluster-scoped variant."
  because: "efficiency: CEL environments are cached across reconciles. robustness: parameters are schema-validated before render. resilience: evaluation is bounded by an explicit cost budget, so one template cannot exhaust the controller."
  rejected: []  # reconstructed from code; the repository retains no record of what was rejected
  adr: ADR-0001

invariants: [DOM-001-R1]

failure_modes:
  - when: "a template exceeds the CEL cost budget"
    expect: "abort the render with a budget error rather than continuing to evaluate"
  - when: "a referenced ComponentType or Trait does not exist"
    expect: "record the condition on the Component; do not cut a release"
  - when: "a reconcile returns a non-nil error"
    expect: "requeue with backoff and record the condition on the resource status"
  - when: "a resource is deleted while dependents exist"
    expect: "run the finalizer cleanup before releasing the object"

resilience:
  timeout_ms: "configured per render via the pipeline's render timeout option"
  retry: "controller-runtime exponential backoff on requeue"
  idempotency: "none"
  degraded: "Existing rendered workloads are unaffected; only new renders fail."

observability:
  logs: []     # logging is free-text through logr/zap; no event-name constants exist to grep for
  metrics: []  # controller-runtime defaults only; this feature defines no metric of its own
  traces: []   # OpenTelemetry is a dependency, but no span is named in this feature's code

non_goals:
