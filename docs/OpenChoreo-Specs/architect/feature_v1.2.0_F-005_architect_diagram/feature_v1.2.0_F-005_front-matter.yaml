approach:
  chosen: "The managed cluster dials out and the gateway multiplexes work back over that connection; occ remote keeps the control plane in the authorization path but out of the byte path."
  because: "efficiency: registry lookup is local-memory only, so no request blocks on a network call to locate an agent. robustness: never-dispatched and outcome-unknown stay distinguishable, so a caller never retries an ambiguous write. resilience: widening backoff on dial, snapshot repair on a sequence gap, and rebalancing with slack above fair share."
  rejected: []  # reconstructed from code; the repository retains no record of what was rejected
  adr: ADR-0001

invariants: [DOM-003-R1, DOM-003-R3, DOM-003-R5, DOM-003-R6, DOM-003-R7, DOM-003-R8, DOM-003-R10]

failure_modes:
  - when: "the pod holds no link to the owning peer"
    expect: "fail immediately with a retryable sentinel so the caller can try another replica"
  - when: "the request was already on the wire when the link dropped"
    expect: "report the outcome as unknown, never as safe to retry"
  - when: "a peer cannot be dialled"
    expect: "retry with a widening backoff, never in a tight loop"
  - when: "a registry sequence gap is detected"
    expect: "request a full snapshot from the owner and do not apply the gapped delta"
  - when: "a reconcile returns a non-nil error"
    expect: "requeue with backoff and record the condition on the resource status"
  - when: "a resource is deleted while dependents exist"
    expect: "run the finalizer cleanup and unregister the connections the pod owned"

resilience:
  timeout_ms: "none configured for forwarding; pod log reads are capped at 10485760 bytes"
  retry: "widening backoff on peer dial; snapshot repair on sequence gap"
  idempotency: "none"
  degraded: "Agents stay connected and workloads keep running when a gateway replica is lost; lookups move to the surviving owner."

observability:
  logs: []     # logging is free-text through logr/zap; no event-name constants exist to grep for
  metrics: []  # controller-runtime defaults only; this feature defines no metric of its own
  traces: []   # OpenTelemetry is a dependency, but no span is named in this feature's code

non_goals:
